; TrayCtl configuration - must be next to trayctl.exe
; Restart TrayCtl after changes.

[psu]
; Each channel runs Windows commands (hidden, via cmd.exe /c):
;   chN_label = name shown in the menu and notifications
;   chN_on    = command that switches the channel on
;   chN_off   = command that switches the channel off
;   chN_read  = command that prints the channel voltage; the first number
;               in its output is shown in the main menu, refreshed every 5 s
; A command must exit with code 0 to count as success.
enabled=1
ch1_label=5V Rail
ch1_on=psu.exe SW1_ON
ch1_off=psu.exe SW1_OFF
ch1_read=psu.exe READ1
ch2_label=12V Rail
ch2_on=psu.exe SW2_ON
ch2_off=psu.exe SW2_OFF
ch2_read=psu.exe READ2
ch3_label=Aux
ch3_on=psu.exe SW3_ON
ch3_off=psu.exe SW3_OFF
ch3_read=psu.exe READ3

[filewatch]
enabled=1
; Wildcards are allowed in ANY component, not just the file name:
;   C:\temp\*.trigger           one fixed folder
;   C:\logs\run_*\*.trigger     '*' and '?' match one folder level
;   C:\Users\fgrando\**\*.trigger   '**' = that folder and its subtree
; The shallowest match wins.
path=C:\Users\fgrando\**\*.trigger
; How deep a '**' may go. Each extra level costs a lot more scanning, and
; the usual case (no signal file) always pays the full walk: rooted at a
; whole profile, a fruitless scan visits ~2.6k folders at 4, ~18k at 6,
; ~62k at 8. Keep this small, or root the path closer to the target.
max_depth=4
interval=2
message=Trigger file detected
; 1 = also show a (green) banner when the file is absent
banner_on_free=1

[autologoff]
enabled=1
; How much idle time is allowed, in minutes. Idle means no mouse or
; keyboard input anywhere in the session; any input puts it back to zero.
; Minimum 1.
minutes=10
; logoff | lock   (use lock while testing)
action=logoff
; What to do when an app with unsaved work tries to block the logoff:
;   0 = let it prompt, and let the user cancel the logoff  (default)
;   1 = force it: apps are killed outright, UNSAVED WORK IS LOST
;   2 = force only apps that have stopped responding
force=1

[tools]
; Name=path|arguments
TeraTerm=C:\Program Files (x86)\teraterm\ttermpro.exe|/C=3 /BAUD=115200
Temp folder=C:\temp
